# 모든 서비스가 같이 읽는 설정 (교재 config-repo/application.yml 에서 메시지 큐·인증 서버를 뺀 것)

# 헬스·정보만 밖으로 연다
management.endpoints.web.exposure.include: "health,info"
management.endpoint.health.show-details: "ALWAYS"

# 분산 추적 (교재 14장). 로컬 실행에는 Zipkin이 없으므로 기록을 만들지 않는다 (docker 프로필에서 켠다)
management.tracing.sampling.probability: 0.0

---
spring.config.activate.on-profile: docker

# 컨테이너 안에서는 관리 포트를 서비스 포트와 나눈다. 컨테이너 헬스체크는 :4004/actuator/health/readiness
# (로컬에서는 여러 서비스를 한 PC에 띄우므로 나누지 않는다)
management.server.port: 4004

# /actuator/health/readiness 를 켠다. 전체 헬스에는 회로 상태처럼 다른 서비스 사정도 들어가서,
# 컨테이너 헬스체크는 자기 준비 상태(readiness)만 본다
management.endpoint.health.probes.enabled: true

# 요청을 전부 추적해 Zipkin으로 보낸다. 추적 화면은 http://localhost:9411
management.tracing.sampling.probability: 1.0
management.tracing.export.zipkin.endpoint: http://zipkin:9411/api/v2/spans
