# summary — light 항목 여러 개(보통 3개)를 묶은 요약
# 원본: 모놀리식 llm-server/app/light_comment.py (light-v5.6e) SUMMARY_SYSTEM, build_summary()
#       분야 내용(비교 표현 목록, 성향 지표 목록, 지표별 어순 규칙)은 빼고 칸으로 바꿈
# 칸 채우는 규칙: 같은 폴더 README.md

version: summary-v1

decoding:
  temperature: 0.4
  top_p: 0.9
  max_tokens: 160

check:
  length: { min: 70, max: 100 }
  numbers: false                 # NUMBER — 숫자가 하나라도 있으면 실패

system: |
  {{context.name}}에 붙는 요약 코멘트를 한국어로 씁니다.
  아래 지표들을 묶어 2~3문장(70~100자)으로 요약하세요.

  규칙
  - 지표를 모두 입력 순서대로 다룹니다. 지표마다 입력의 '방향'을 그대로 따르고, 강도도 방향 문장과 같게 씁니다.
  - 지표마다 절을 나눕니다. 두 지표를 한 주어로 묶지 마세요('A와 B 모두 …' ✗).
  - 지표 이름은 입력의 이름 그대로 씁니다.
  - 방향 문장이 '~하는 편입니다', '~하는 흐름입니다'나 '그 폭은 작은 편'인 지표는 '크게', '뚜렷하게' 같은 말로 부풀리지 마세요. 값이 0이 아닌 지표를 '같은 수준', '비슷하다'로 쓰지 마세요.
  {{reliability_rule}}
  - 숫자(값)는 쓰지 마세요.
  - 지표 사이를 '다만', '반면', '하지만', '~해서', '~ 덕분에'로 잇지 말고, '전반적으로 잘한다' 같은 종합 평가도 쓰지 마세요.
  - 첫머리는 '이번 분석에서 눈에 띄는 점은 …'처럼 시작해도 됩니다. 개별 문장을 그대로 이어 붙이지 마세요.
  - 지표 이름 뒤에 쌍점(:)을 붙여 나열하지 마세요.
  - 사람을 한 유형으로 규정하지 마세요. 주어는 사람이 아니라 지표로 씁니다.
  - 입력에 없는 대상과 비교하지 마세요. '~해야 합니다' 같은 조언은 쓰지 마세요.
  {{context.rules}}
  - 요약 문장만 쓰세요. 제목, 목록, 따옴표는 쓰지 마세요.

# {{items}} 는 항목마다 item_line 한 줄씩 (입력 순서 그대로)
user: |
  지표
  {{items}}
item_line: "- {{label}}: 방향: {{direction}}"

# summary 는 항목이 여러 개라 degree_rules 를 넣지 않음 (원본도 공통 규칙 한 줄로 처리)
reliability_rules:
  insufficient: "- 기록이 적은 지표가 있으면 그 절에 '아직 기록이 적어' 같은 단서를 붙이고 단정하지 마세요."

# 7b DEGREE 검사는 summary 에서는 하지 않음 — 항목이 여러 개라 어느 절이 어느 강도인지 엔진이 나눌 수 없음
degree_forbidden: {}

leak_markers: ["규칙", "지표:", "방향:", "예시:", "출력", "2~3문장", "{{", "}}"]
