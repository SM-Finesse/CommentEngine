# sentence — light 항목 하나에 붙는 한 문장
# 원본: 모놀리식 llm-server/app/light_comment.py (light-v5.6e) build_sentence()
#       분야 내용(지표 이름·비교 표현·서술어 규칙)은 빼고 칸으로 바꿈. 빠진 것은 칩이 context·item.rules로 보냄
# 칸 채우는 규칙: 같은 폴더 README.md

version: sentence-v1

# 엔진 → llm-server /v1/generate 에 그대로 (원본 LIGHT_COMMENT_DECODING["sentence"])
decoding:
  temperature: 0.4
  top_p: 0.9
  max_tokens: 119

# 7b 검사 설정
check:
  length: { min: 40, max: 60 }   # FORMAT
  numbers: true                  # NUMBER — 괄호 안 value_text 인용만 허용

system: |
  {{context.name}}에 붙는 하이라이트 문장 하나를 한국어로 씁니다.
  아래 지표 값이 무엇을 뜻하는지 한 문장(40~60자)으로 쓰세요.

  규칙
  - 방향은 입력의 '방향'을 그대로 따르세요. 값의 부호를 다시 해석하지 마세요.
  {{degree_rule}}
  {{reliability_rule}}
  - 이 지표 하나만 씁니다. 다른 지표는 말하지 마세요.
  - 지표 이름은 입력의 이름 그대로 씁니다.
  - 값을 쓰려면 문장 끝 괄호에 입력 그대로 씁니다. 예: ({{value_text}}). 다시 반올림하지 말고, 괄호 밖에는 숫자를 쓰지 마세요. 값은 빼도 됩니다. 백분율로 바꾸거나 입력에 없는 숫자를 만들지 마세요.
  - 사람을 한 유형으로 규정하지 마세요. 주어는 사람이 아니라 지표로 씁니다.
  - 입력에 없는 대상과 비교하지 마세요.
  - '~해야 합니다' 같은 조언은 쓰지 마세요.
  {{context.rules}}
  {{item.rules}}
  - 문장 하나만 쓰세요. 제목, 목록, 따옴표는 쓰지 마세요.

user: |
  지표: {{label}}
  뜻: {{meaning}}
  값: {{value_text}}
  방향: {{direction}}
  예시: {{direction}}.

# {{degree_rule}} 에 들어가는 줄 (원본 build_sentence 의 degree 표)
degree_rules:
  strong: "- 방향 문장대로 차이가 분명하다고 씁니다('뚜렷하게', '눈에 띄게', '확연히', '분명하게', '크게' 중 하나). '비슷합니다', '크지 않습니다'로 흐리지 마세요."
  weak: "- 방향은 지키되 '조금', '소폭', '~하긴 하지만 그 폭은 작은 편'처럼 폭이 작다고 씁니다. '뚜렷하게', '크게' 같은 말로 부풀리지 마세요."
  mid: "- '~하는 편입니다', '~하는 흐름입니다'처럼 방향만 담담하게 씁니다. '뚜렷하게', '크게'는 쓰지 말고, 값이 0이 아니므로 '같은 수준', '비슷합니다'도 쓰지 마세요."
  zero: "- 값이 0이므로 '같은 수준입니다'로 씁니다."

# {{reliability_rule}} 에 들어가는 줄. 없는 값(moderate·sufficient)은 빈 줄 → 줄째 지움
reliability_rules:
  insufficient: "- 아직 기록이 적다는 단서('아직 기록이 적어', '지금까지의 기록으로는')를 붙이고 단정하지 마세요."

# 7b DEGREE 검사 — degree 별로 문장에 있으면 실패 (label·direction 글자는 빼고 봄)
# 원본 validation.py _INTENSIFIERS, light_comment.py _VAGUE
degree_forbidden:
  strong: [비슷, 같은 수준, 크지 않, 차이가 없, 차이는 없]
  weak: [뚜렷, 크게, 두드러, 매우, 훨씬, 압도, 확연, 현저, 눈에 띄, 분명하게, 분명히, 같은 수준]
  mid: [뚜렷, 크게, 두드러, 매우, 훨씬, 압도, 확연, 현저, 눈에 띄, 분명하게, 분명히, 같은 수준, 비슷, 차이가 없]
  zero: [뚜렷, 크게, 두드러, 매우, 훨씬, 압도, 확연, 현저, 눈에 띄, 분명하게, 분명히]

# 7b LEAK 검사 — 지시문·입력 머리말이 문장에 나오면 실패 (원본 light6.py _ECHO 에서 분야 말 뺀 것)
leak_markers: ["규칙", "지표:", "뜻:", "값:", "방향:", "예시:", "출력", "한 문장(40", "{{", "}}"]
