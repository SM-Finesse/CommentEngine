// 본체의 유일한 입구 (교재 10장 spring-cloud/gateway). 인증·HTTPS·Eureka는 뺀다 (설계서 3장)
plugins {
    id 'org.springframework.boot' version '4.1.1'
}

dependencies {
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.4')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // gateway만 WebFlux (설계서 3장 [결정, 11/15]). 나머지 서비스는 WebMVC
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// 실행 jar 하나만 만든다 (Docker는 조각 10에서 build/libs/*.jar 하나를 집음)
tasks.named('jar') {
    enabled = false
}

// bootRun·test의 작업 폴더 = 이 모듈 폴더. 설정은 ../../config-repo 와 ../../chips/*/gateway.yml 에서 읽는다
