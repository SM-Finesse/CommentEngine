# 설정 본문은 config-repo에 있다 (교재 12장 폴더 구조, Config Server는 두지 않음 — 설계서 3장).
# 칩이 들고 오는 경로(chips/<칩>/gateway.yml)도 같이 읽는다. 칩이 하나도 없으면 칩 경로 없이 뜬다.
# 로컬 실행: 작업 폴더가 이 모듈 폴더라 ../../config-repo 와 ../../chips 를 읽는다.
# 다른 곳에서 띄울 때는 CONFIG_DIR·CHIPS_DIR 환경변수로 폴더만 바꾼다.
spring:
  config:
    import:
      - file:${CONFIG_DIR:../../config-repo}/application.yml
      - file:${CONFIG_DIR:../../config-repo}/gateway.yml
      - optional:file:${CHIPS_DIR:../../chips}/*/gateway.yml
