// tetris 칩의 조합 서비스 — 교재 3장 product-composite 자리. 화면 요청을 받아 tetris-analytics(나중에 엔진)를 부른다.
plugins {
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.finesse'

dependencies {
    // 칩 안 계약: 통계 DTO (조각 3). 지금은 시험에서 "읽힌다"만 확인하고, 화면에는 받은 바이트를 그대로 넘긴다
    implementation project(':chips:tetris:tetris-api')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // tetris-analytics 구간의 다시 시도·회로 차단기 (교재 13장 애너테이션 방식). 버전은 11/10 버전 시험에서 정한 값
    implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'   // @Retry·@CircuitBreaker가 쓰는 AOP

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// 실행 jar 하나만 만든다 (Docker는 조각 10)
tasks.named('jar') {
    enabled = false
}

// bootRun·test의 작업 폴더 = 이 모듈 폴더. 설정은 ../../../config-repo/application.yml 과 ../config/finesse-api.yml 에서 읽는다
