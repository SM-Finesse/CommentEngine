# tetris 칩의 서비스. 본체 compose(docker-compose.yml)에 겹쳐서 쓴다 — 혼자서는 뜨지 않는다.
# 레포 루트 .env 의 COMPOSE_FILE 에 이 파일이 적혀 있어서, 루트에서 `docker compose up -d --build` 하면 같이 뜬다.
# 경로는 레포 루트 기준이다 (겹쳐 쓰는 compose 파일의 경로는 첫 파일의 폴더를 기준으로 한다).
#
#   gateway /api/** → finesse-api → tetris-analytics → TETR.IO
#
# 이 칩을 뽑으려면 .env 의 COMPOSE_FILE 에서 이 파일만 뺀다. 본체 파일은 그대로다.
#
# 아직 없는 것 (조각이 병합되면 더한다):
#   frontend (TETRIO 화면, 8088)            조각 11
#   select-screen 에 칩 카드 꽂기            조각 11
#   comment-engine 에 이 칩의 생성 서버 주소   조각 5 · 7b (그전까지는 e2e/test-gen 으로 개발)

x-healthcheck: &healthcheck
  # 본체 compose와 같은 헬스체크 (compose 파일끼리는 &이름을 같이 쓸 수 없어 한 번 더 적는다)
  test:
    - CMD
    - bash
    - -c
    - >-
      exec 3<>/dev/tcp/localhost/4004 &&
      printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
      grep -q '"status":"UP"' <&3
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  # 본체 gateway에 이 칩의 경로 파일 하나를 꽂는다 (본체 compose의 volumes에 이 줄이 더해진다)
  gateway:
    volumes:
      - ./chips/tetris/gateway.yml:/chips/tetris/gateway.yml:ro

  # 화면이 부르는 API. gateway의 /api/** 가 여기로 온다 (chips/tetris/gateway.yml). 밖으로는 열지 않는다
  finesse-api:
    build: chips/tetris/finesse-api
    image: commentengine/finesse-api
    mem_limit: 512m
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # finesse-api 의 application.yml 이 이 두 폴더에서 설정을 읽는다
      - CONFIG_DIR=/config-repo
      - CHIP_CONFIG_DIR=/chip-config
      - ANALYTICS_BASE_URL=http://tetris-analytics:7002
    volumes:
      - ./config-repo:/config-repo:ro          # 공통 설정(application.yml)만 본체 것을 같이 읽는다
      - ./chips/tetris/config:/chip-config:ro
    healthcheck: *healthcheck
    depends_on:
      tetris-analytics:
        condition: service_healthy
      zipkin:
        condition: service_started

  # 분석 서비스 (모놀리식 calc·통계를 옮김). TETR.IO에서 전적을 받아 지표를 계산한다. 밖으로는 열지 않는다
  tetris-analytics:
    build: chips/tetris/tetris-analytics
    image: commentengine/tetris-analytics
    mem_limit: 768m
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # 자기 설정은 jar 안 application.yml. 공통 설정(관리 포트 4004, 추적)만 본체 것을 덧붙여 읽는다
      - SPRING_CONFIG_ADDITIONAL_LOCATION=optional:file:/config-repo/application.yml
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck: *healthcheck
    depends_on:
      zipkin:
        condition: service_started
