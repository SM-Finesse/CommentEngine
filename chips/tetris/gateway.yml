# tetris 칩이 gateway에 들고 가는 경로 (ChipRoutesConfiguration). gateway 코드·config-repo/gateway.yml은 고치지 않는다
app.routes:
  finesse-api:
    uri: http://localhost:8092
    paths:
      - /api/**

# 헬스 모으기용 주소 (gateway 헬스 모으기는 아직 없음 — 그때 이 묶음을 읽는다)
app.health:
  finesse-api: http://localhost:8092/actuator/health
  tetris-analytics: http://localhost:7002/actuator/health

---
# 컨테이너 안 (docker 프로필): 서비스 이름으로 찾고, 헬스는 관리 포트(4004)에 있다
spring.config.activate.on-profile: docker

app.routes.finesse-api.uri: http://finesse-api:8092
app.health:
  finesse-api: http://finesse-api:4004/actuator/health
  tetris-analytics: http://tetris-analytics:4004/actuator/health
