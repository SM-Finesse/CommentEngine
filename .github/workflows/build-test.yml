name: build-test

# 조각 10. PR과 main 푸시에서 돈다.
#   test     빌드·단위 시험 (모든 모듈), 본체 분야 단어 0건, 시험용 생성 서버 규약
#   compose  jar → docker compose 로 본체 + tetris 칩을 띄워 gateway를 거쳐 부르고, 추적과 칩 꽂기·뽑기를 본다
# 조각이 병합될 때마다 여기에 확인을 더한다 (엔진 → 조각 5·7b, light·heavy → 조각 8·9, 화면 → 조각 11).
on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: 본체 분야 단어 0건
        run: bash e2e/domain-words.sh

      - name: 빌드·시험
        # --continue: 한 모듈 시험이 실패해도 나머지 모듈 시험까지 돌려서 전체 결과를 본다
        run: bash ./gradlew build --continue --console=plain

      - name: 시험 수 세기
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          # 수는 testcase로 센다. 다시 돌린 시험(tetris-analytics의 test-retry)은 묶음 속성에 시도마다 잡혀서,
          # 속성으로 세면 결국 통과한 시험도 실패로 보인다
          total = fail = skip = flaky = 0
          notes = []
          for f in sorted(glob.glob('**/build/test-results/test/*.xml', recursive=True)):
              r = ET.parse(f).getroot()
              for case in r.iter('testcase'):
                  total += 1
                  name = f"{case.get('classname')} > {case.get('name')}"
                  bad = case.findall('failure') + case.findall('error')
                  again = case.findall('flakyFailure') + case.findall('flakyError')
                  if bad:
                      fail += 1
                      notes.append(f"FAILED {name}: {(bad[0].get('message') or '').strip()[:400]}")
                  elif case.find('skipped') is not None:
                      skip += 1
                  elif again:
                      flaky += 1
                      notes.append(f"FLAKY {name}: {len(again)}번 실패 후 통과")
          print(f"TOTAL tests={total} failed={fail} skipped={skip} flaky={flaky}")
          for line in notes:
              print(line)
          PY

      - name: 시험 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: '**/build/reports/tests/test'
          if-no-files-found: ignore

      - name: 시험용 생성 서버 규약 (/v1/generate)
        run: bash e2e/test-gen-check.sh

  compose:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: jar 만들기
        run: bash ./gradlew build -x test --console=plain

      - name: 띄우기 (.env 의 COMPOSE_FILE = 본체 + tetris 칩)
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: gateway 경유 호출
        run: |
          set -e
          echo "== finesse-api 경유 통계. 틀린 유저명이라 TETR.IO는 부르지 않음 → 400 INVALID_USERNAME"
          code=$(curl -s -o /tmp/stats.txt -w '%{http_code}' http://localhost:8080/api/v1/stats/a); cat /tmp/stats.txt; echo " [HTTP $code]"
          test "$code" = "400"
          grep -q '"error_code":"INVALID_USERNAME"' /tmp/stats.txt
          echo "== 규칙 밖 경로는 404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/nope)" = "404"
          echo "== 컨테이너 헬스 (관리 포트 4004의 readiness)"
          docker compose ps --format '{{.Service}} {{.Health}}' | tee /tmp/health.txt
          if grep -v -E ' healthy$|^zipkin ' /tmp/health.txt; then echo "healthy 가 아닌 서비스가 있음"; exit 1; fi

      - name: 추적 확인 (Zipkin)
        run: python3 e2e/trace-check.py

      - name: 칩 꽂기·뽑기 (.env 한 줄)
        run: bash e2e/plug-test.sh

      - name: 상태와 로그
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 80
