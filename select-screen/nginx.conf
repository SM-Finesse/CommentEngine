server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /config.json { add_header Cache-Control "no-store"; }

    # 칩 카드: compose에서 칩마다 /cards/<칩> 으로 폴더 하나를 끼운다
    # 하나도 안 끼우면 /cards/ 폴더가 없어 404 → app.js가 "칩 없음"으로 처리
    location /cards/ {
        alias /cards/;
        autoindex on;
        autoindex_format json;     # [{"name":"<칩>","type":"directory",...}]
        add_header Cache-Control "no-store";
    }
}
